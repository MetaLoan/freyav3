<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover"
    />
    <title>Freya V3</title>
    <!-- 预加载字体，减少 Web 端慢网络下的加载超时 -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?v=8.0"></script>
    <script>
      // 早期 Telegram 初始化（React 渲染前执行，抢占全屏时机）
      (function() {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;

          // 1. 立即通知 Telegram 应用已就绪
          tg.ready();

          // 2. 设置主题颜色（避免白色闪屏）
          if (tg.setHeaderColor) tg.setHeaderColor('#131110');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#131110');

          // 3. 先 expand 到最大高度
          try { tg.expand(); } catch(e) {}

          // 4. 立即请求全屏（SDK 方法）
          var requestFS = function() {
            // 方法 A: SDK requestFullscreen
            if (typeof tg.requestFullscreen === 'function') {
              try { tg.requestFullscreen(); return; } catch(e) {}
            }
            // 方法 B: TelegramWebviewProxy（移动端直接通信）
            if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
              try { window.TelegramWebviewProxy.postEvent('web_app_request_fullscreen', ''); return; } catch(e) {}
            }
            // 方法 C: iframe postMessage
            if (window.parent && window.parent !== window) {
              try { window.parent.postMessage(JSON.stringify({eventType:'web_app_request_fullscreen',eventData:''}), '*'); } catch(e) {}
            }
          };

          // 立即请求 + 延迟重试（Telegram 可能需要时间处理 ready 信号）
          requestFS();
          setTimeout(requestFS, 300);
          setTimeout(requestFS, 800);
          setTimeout(requestFS, 1500);

          // 5. 监听全屏失败事件（调试用）
          if (typeof tg.onEvent === 'function') {
            tg.onEvent('fullscreenFailed', function(e) {
              console.warn('[TG Early] fullscreenFailed:', e && e.error || e);
              // 如果失败原因不是 ALREADY_FULLSCREEN，再试一次
              if (e && e.error !== 'ALREADY_FULLSCREEN') {
                setTimeout(requestFS, 500);
              }
            });
            tg.onEvent('fullscreenChanged', function() {
              console.log('[TG Early] fullscreenChanged:', tg.isFullscreen);
            });
          }
        } catch(e) {
          console.error('[TG Early] init failed:', e);
        }
      })();
    </script>
    
    <style>
      /* 全局重置 */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Telegram 安全区域 CSS 变量 */
      :root {
        --telegram-safe-area-top: calc(
          var(--tg-safe-area-inset-top, 0px) +
          var(--tg-content-safe-area-inset-top, 0px)
        );
        --telegram-safe-area-bottom: var(--tg-safe-area-inset-bottom, 0px);
        --telegram-button-height: var(--tg-content-safe-area-inset-top, 0px);
      }

      /* 禁用 Web 端的默认选择、拖拽等行为（提升 App 手感） */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
